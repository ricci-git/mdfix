[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mdfix"
version = "0.9.0"
description = "Markdown formatter and documentation linter"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    { name = "Ricci", email = "ricci@example.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.27.3",
    "rich>=15.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[project.scripts]
mdfix = "mdfix.cli:app"
